name: e2e

on:
  push:
    branches: [main, frontend, backend]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/e2e.yml'
  # Every pull request runs it: it is a required check on main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright against Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait web

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color api web

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
