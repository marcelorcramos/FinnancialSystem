name: finnancial

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 20

x-backend-env: &backend-env
  ENVIRONMENT: dev
  DATABASE_URL: postgresql+asyncpg://finance:finance_dev@postgres:5432/finance
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://finance:finance_dev@rabbitmq:5672/
  SECRET_KEY: dev-secret-key-change-me-0123456789abcdef
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Links in emails open the Compose web app.
  FRONTEND_URL: http://localhost:8080
  # Empty until set in the shell: Sign in with Google stays off (docs/GOOGLE_SIGN_IN.md).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  S3_ENDPOINT_URL: http://s3:8333
  # Signed links are opened by the browser, which reaches S3 on the published port.
  S3_PUBLIC_URL: http://localhost:8333

# Background processes run the API image with another command. They start once the
# API is healthy, which means the migrations have run.
x-backend-process: &backend-process
  build: ../backend
  image: finnancial-backend:dev
  environment: *backend-env
  restart: unless-stopped
  depends_on:
    api: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev
      POSTGRES_DB: finance
    ports: ["5544:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: finance
      RABBITMQ_DEFAULT_PASS: finance_dev
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  # S3-compatible storage (replaces MinIO, whose images are no longer public). S3 on :8333.
  s3:
    image: chrislusf/seaweedfs:4.50
    # Credentials in seaweedfs/s3.json; without them nothing can be read (no anonymous access).
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333", "9333:9333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  api:
    build: ../backend
    image: finnancial-backend:dev
    environment:
      <<: *backend-env
      CORS_ORIGINS: http://localhost:4200
      # Trust X-Forwarded-For from the web container (nginx), so rate limits see the real client.
      FORWARDED_ALLOW_IPS: "*"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  # Publishes outbox_events to RabbitMQ.
  relay:
    <<: *backend-process
    command: ["python", "-m", "app.events.relay"]

  # One consumer process per queue.
  consumer-cache:
    <<: *backend-process
    command: ["python", "-m", "app.events.consumers", "cache"]

  consumer-limits:
    <<: *backend-process
    command: ["python", "-m", "app.events.consumers", "limits"]

  consumer-goals:
    <<: *backend-process
    command: ["python", "-m", "app.events.consumers", "goals"]

  worker:
    <<: *backend-process
    # Mingle, gossip and event heartbeats talk through transient queues, which RabbitMQ 4
    # refuses (remote control is off in celery_app.py for the same reason).
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --without-mingle
      - --without-gossip
      - --without-heartbeat

  beat:
    <<: *backend-process
    # The schedule file lives in /tmp: the image runs as a non-root user.
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  web:
    build: ../frontend
    environment:
      API_UPSTREAM: http://api:8000
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]

volumes:
  pgdata:
  s3data:
