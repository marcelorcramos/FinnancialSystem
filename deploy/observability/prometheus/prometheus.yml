# Every process of the app, plus RabbitMQ's own exporter. One target per Compose service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: relay
    static_configs:
      - targets: ["relay:9100"]

  - job_name: consumers
    static_configs:
      - targets: ["consumer-cache:9100"]
        labels: { service: consumer-cache }
      - targets: ["consumer-limits:9100"]
        labels: { service: consumer-limits }
      - targets: ["consumer-goals:9100"]
        labels: { service: consumer-goals }
      - targets: ["consumer-insights:9100"]
        labels: { service: consumer-insights }

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  # Queue depth, consumers and dead letters, per queue (rabbitmq_prometheus plugin).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]
